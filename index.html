<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><JavaScript-api></JavaScript-api></title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="container header-row">
        <div class="search">
          <input
            type="text"
            id="busca"
            onkeyup="pesquisarTarefa()"
            placeholder="Pesquisar por título"
          />
        </div>
        <div class="alterar-tema">
          <button
            id="alterarTema"
            aria-label="Alternar tema"
            title="Alternar tema"
          >
            🌙
          </button>
        </div>
      </div>
    </header>
    <main>
      <section id="tarefas">
        <h2>Tarefas <button onclick="abrirModal()">Nova Tarefa</button></h2>
        <ul id="lista"></ul>
      </section>
      <section id="overlay" onclick="fecharModal()"></section>
      <div id="criarTarefa" class="modal">
        <form onsubmit="novaTarefa(event)">
          <h3>
            Criar tarefa
            <box-icon name="x" size="md" onclick="fecharModal()"></box-icon>
          </h3>
          <label for="titulo">Título</label>
          <input type="text" id="titulo" required />
          <label for="descricao">Descrição</label>
          <textarea id="descricao" required></textarea>
          <button>Criar</button>
        </form>
      </div>
    </main>
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <script src="script.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
